<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INGEBAM | Administración</title><link rel="stylesheet" href="studio.css"></head><body><header><strong>INGEBAM / PANEL CLIENTE</strong><div class="row"><a href="index.html" target="_blank">Ver página pública</a><button id="save" class="secondary">Guardar borrador</button><button id="publish">Publicar cambios</button></div></header><div class="notice">Demostración local: sin inicio de sesión ni publicación remota. Los cambios solo se guardan en este navegador.</div><div class="panel"><aside><h3>Administración</h3><button data-tab="home">Portada e identidad</button><button data-tab="products">Productos y servicios</button><button data-tab="about">Información corporativa</button><button data-tab="contact">Contacto y redes</button><button data-tab="promo">Promociones</button></aside><main><h2 id="title"></h2><div id="fields"></div><p id="status" role="status"></p></main></div><script src="content.js"></script><script>let state=read(),tab='home';const p=$('fields');function field(parent,o,k,label,type='text'){let l=node('label',label),el=node(type==='textarea'?'textarea':'input');if(type!=='textarea')el.type=type;el.value=o[k]??'';if(type==='checkbox')el.checked=o[k];el.oninput=()=>{o[k]=type==='checkbox'?el.checked:type==='number'?Math.max(0,Number(el.value)):el.value};l.append(el);parent.append(l)}function button(parent,t,fn){let b=node('button',t,'secondary');b.onclick=fn;parent.append(b)}function upload(parent,fn){let f=node('input');f.type='file';f.accept='image/jpeg,image/png,image/webp,image/gif';f.onchange=()=>{let file=f.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>750000){$('status').textContent='Imagen inválida o superior a 750 KB';return}let r=new FileReader();r.onload=()=>{fn(r.result);render()};r.readAsDataURL(file)};parent.append(f)}function image(parent,o,k,label){field(parent,o,k,label+' (URL HTTPS)');if(o[k]){let i=photo(o[k]);i.style.maxHeight='120px';parent.append(i)}upload(parent,v=>o[k]=v);button(parent,'Quitar imagen',()=>{o[k]='';render()})}function render(){p.replaceChildren();let s=state.draft;$('title').textContent=({home:'Portada e identidad',products:'Productos y servicios',about:'Información corporativa',contact:'Contacto y redes',promo:'Promociones'})[tab];if(tab==='home'){field(p,s,'name','Nombre comercial');field(p,s,'headline','Título de portada');field(p,s,'intro','Descripción','textarea');image(p,s,'logo','Logo');image(p,s,'hero','Imagen de portada')}if(tab==='about')field(p,s,'about','Quiénes somos','textarea');if(tab==='contact'){field(p,s,'phone','WhatsApp con código de país');field(p,s,'email','Correo','email');field(p,s,'instagram','Instagram (URL HTTPS)')}if(tab==='promo')field(p,s,'promotion','Banner promocional (vacío para ocultar)','textarea');if(tab==='products'){s.products.forEach((item,i)=>{let box=node('div',null,'product');field(box,item,'name','Nombre');field(box,item,'description','Descripción','textarea');field(box,item,'price','Precio CLP','number');field(box,item,'stock','Stock','number');field(box,item,'active','Visible en la página','checkbox');item.photos.forEach((src,j)=>{let im=photo(src);im.style.maxHeight='100px';box.append(im);button(box,'Eliminar foto '+(j+1),()=>{item.photos.splice(j,1);render()})});if(item.photos.length<4)upload(box,v=>item.photos.push(v));button(box,'Eliminar producto',()=>{if(confirm('¿Eliminar producto?')){s.products.splice(i,1);render()}});p.append(box)});button(p,'+ Nuevo producto',()=>{s.products.push({name:'Nuevo producto',description:'',price:0,stock:0,active:true,photos:[]});render()})}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('save').onclick=()=>{try{save(state);$('status').textContent='Borrador guardado'}catch{$('status').textContent='No se pudo guardar: almacenamiento lleno'}};$('publish').onclick=()=>{let next={draft:state.draft,published:structuredClone(state.draft)};try{save(next);state=next;$('status').textContent='Cambios publicados en la demo local. Abre la página pública en este navegador.'}catch{$('status').textContent='No se pudo publicar: almacenamiento lleno'}};render();</script></body></html>
