<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INGEBAM Web Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#101217;color:#e9edf3;font:14px system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#292e39;color:inherit;border:1px solid #434956;border-radius:8px;padding:10px}button:hover{background:#414957}button.primary{background:#d7b46a;color:#171717;border:0;font-weight:700}header{display:flex;gap:10px;align-items:center;padding:15px 22px;border-bottom:1px solid #30343d;flex-wrap:wrap}header strong{font-size:19px;color:#d7b46a;margin-right:auto}main{display:grid;grid-template-columns:220px 320px minmax(0,1fr);min-height:90vh}aside,section.editor{padding:18px;border-right:1px solid #30343d}aside button{display:block;width:100%;text-align:left;margin:6px 0}h2{font-size:16px}label{display:block;color:#aeb7c8;margin:12px 0 5px}input,textarea,select{width:100%;background:#1c2028;color:white;border:1px solid #414653;padding:10px;border-radius:6px}textarea{min-height:80px}input[type=color]{height:40px}input[type=checkbox]{width:auto}#preview{background:#30343d;padding:20px;overflow:auto}iframe{display:block;width:100%;min-height:780px;border:0;background:white;margin:auto;border-radius:8px}.muted{color:#9ba5b4;font-size:12px}.row{display:flex;gap:5px;flex-wrap:wrap}.row button{flex:1}#status{font-size:12px;color:#d7b46a}@media(max-width:900px){main{grid-template-columns:1fr}aside,section.editor{border-bottom:1px solid #30343d}#preview{padding:8px}}</style><header><strong>INGEBAM / WEB STUDIO</strong><span class="muted">V1 · DEMO LOCAL</span><button id="save">Guardar borrador</button><button id="published">Ver publicado</button><button id="publish" class="primary">Publicar demo</button><button id="export">Exportar HTML</button><span id="status"></span></header><main><aside><h2>Tu sitio web</h2><label>Plantilla inicial</label><select id="template"><option value="">Elegir plantilla</option><option value="services">Servicios</option><option value="shop">Tienda</option><option value="build">Construcción</option></select><button data-tab="brand">Identidad y SEO</button><button data-tab="contact">Contacto y redes</button><h2>Secciones</h2><div id="sections"></div><button id="add">+ Agregar sección</button><p class="muted">Los datos se guardan únicamente en este navegador. No existe todavía autenticación ni publicación remota.</p></aside><section class="editor"><h2 id="editorTitle">Editar contenido</h2><div id="fields"></div></section><section id="preview"><div class="row"><button id="desktop">Escritorio</button><button id="mobile">Móvil</button><button id="draft">Vista borrador</button></div><p id="previewLabel" class="muted">Vista previa del borrador</p><iframe id="frame" sandbox="" title="Vista previa del sitio"></iframe></section></main><script>
"use strict";
const $=id=>document.getElementById(id), key="ingebam-web-studio-v1";
const templates={services:["Empresa Demo","Soluciones que hacen crecer tu negocio","Nuestros servicios"],shop:["Tienda Demo","Encuentra tu próximo favorito","Productos destacados"],build:["Constructora Demo","Construimos tus próximos proyectos","Soluciones constructivas"]};
function initial(type="services"){let t=templates[type];return {name:t[0],logo:"",primary:"#203c37",accent:"#b6dc89",font:"system-ui",seo:t[0],description:"Sitio de demostración",email:"",phone:"",instagram:"",address:"",sections:[{id:crypto.randomUUID(),type:"hero",title:t[1],body:"Descubre nuestra propuesta y solicita más información.",button:"Contáctanos",image:"",visible:true},{id:crypto.randomUUID(),type:"catalog",title:t[2],body:"Conoce nuestras alternativas",visible:true,items:[{name:"Ejemplo 1",description:"Descripción editable",price:0,image:"",active:true},{name:"Ejemplo 2",description:"Descripción editable",price:0,image:"",active:true}]},{id:crypto.randomUUID(),type:"text",title:"Sobre nosotros",body:"Presenta aquí tu empresa.",image:"",visible:true}]}}
let state=initial(),published=null;try{let saved=JSON.parse(localStorage.getItem(key));if(saved?.draft?.sections){state=saved.draft;published=saved.published}}catch(e){}
let tab="brand",mode="draft";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeImage(v){return /^https:\/\//i.test(v)||/^data:image\/(png|jpeg|webp|gif);base64,[a-z0-9+/=]+$/i.test(v)?esc(v):""}
const color=(v,f)=>/^#[a-f0-9]{6}$/i.test(v)?v:f;
const img=v=>safeImage(v)?'<img src="'+safeImage(v)+'" alt="">':"";
function html(s){let contact=s.email?'mailto:'+encodeURIComponent(s.email).replace(/%40/g,"@"):s.phone?'https://wa.me/'+s.phone.replace(/\D/g,""):"#contacto";return '<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="'+esc(s.description)+'"><title>'+esc(s.seo)+'</title><style>*{box-sizing:border-box}body{margin:0;font-family:'+ (s.font==="Georgia"?"Georgia,serif":s.font==="Arial"?"Arial,sans-serif":"system-ui,sans-serif") +';color:#21332e;background:#fafaf6}nav{padding:24px 6%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}nav img{max-width:140px;max-height:60px}a{color:inherit}section{padding:55px 6%}h1{font-size:clamp(34px,6vw,76px);line-height:1.05;margin:15px 0}h2{font-size:32px}p{line-height:1.7;white-space:pre-line}.hero{background:'+color(s.primary,"#203c37")+';color:white;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));align-items:center;gap:24px;min-height:420px}.cta{display:inline-block;background:'+color(s.accent,"#b6dc89")+';color:#15241e;padding:15px 20px;text-decoration:none;border-radius:5px;font-weight:bold}img{max-width:100%;border-radius:8px;object-fit:cover}.hero img{width:100%;max-height:430px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:18px}article{background:white;border:1px solid #ddd;padding:20px;border-radius:12px}article img{width:100%;height:190px}footer{background:#182620;color:white;padding:35px 6%}</style><nav><strong>'+img(s.logo)+esc(s.name)+'</strong><div>'+s.sections.filter(x=>x.visible&&x.type!=="hero").map(x=>'<a href="#s-'+esc(x.id)+'">'+esc(x.title)+'</a>').join(" · ")+'</div></nav>'+s.sections.filter(x=>x.visible).map(x=>x.type==="hero"?'<section class="hero" id="s-'+esc(x.id)+'"><div><h1>'+esc(x.title)+'</h1><p>'+esc(x.body)+'</p><a class="cta" href="'+esc(contact)+'">'+esc(x.button||"Contáctanos")+'</a></div>'+img(x.image)+'</section>':x.type==="catalog"?'<section id="s-'+esc(x.id)+'"><h2>'+esc(x.title)+'</h2><p>'+esc(x.body)+'</p><div class="cards">'+(x.items||[]).filter(i=>i.active).map(i=>'<article>'+img(i.image)+'<h3>'+esc(i.name)+'</h3><p>'+esc(i.description)+'</p><strong>'+(Number(i.price)>0?Number(i.price).toLocaleString("es-CL",{style:"currency",currency:"CLP"}):"Consultar precio")+'</strong></article>').join("")+'</div></section>':'<section id="s-'+esc(x.id)+'"><h2>'+esc(x.title)+'</h2><p>'+esc(x.body)+'</p>'+img(x.image)+'</section>').join("")+'<footer id="contacto"><h2>'+esc(s.name)+'</h2><p>'+esc(s.address)+'\n'+esc(s.email)+'\n'+esc(s.phone)+'</p>'+( /^https:\/\/(www\.)?instagram\.com\//i.test(s.instagram)?'<a href="'+esc(s.instagram)+'">Instagram</a>':"")+'</footer></html>'}
function preview(){let s=mode==="published"?published:state;$("frame").srcdoc=s?html(s):"<p>Aún no hay una publicación.</p>";$("previewLabel").textContent=mode==="published"?"Versión publicada local":"Vista previa del borrador"}
function status(t){$("status").textContent=t}
function store(){try{localStorage.setItem(key,JSON.stringify({draft:state,published}));return true}catch(e){status("No se pudo guardar: espacio insuficiente");return false}}
function field(parent,obj,k,label,type="text"){let l=document.createElement("label");l.textContent=label;let el=document.createElement(type==="textarea"?"textarea":"input");if(type!=="textarea")el.type=type;el.value=obj[k]??"";if(type==="checkbox")el.checked=!!obj[k];el.addEventListener("input",()=>{obj[k]=type==="checkbox"?el.checked:type==="number"?Math.max(0,Number(el.value)):el.value;preview()});parent.append(l,el)}
function imageField(p,o,k,label){field(p,o,k,label+" (URL HTTPS)");let f=document.createElement("input");f.type="file";f.accept="image/png,image/jpeg,image/webp,image/gif";f.onchange=()=>{let file=f.files[0];if(!file)return;if(file.size>1000000){status("Imagen máxima: 1 MB");return}let r=new FileReader();r.onload=()=>{o[k]=r.result;render();preview()};r.readAsDataURL(file)};p.append(f)}
function btn(p,t,fn){let b=document.createElement("button");b.textContent=t;b.onclick=fn;p.append(b);return b}
function render(){let p=$("fields");p.replaceChildren();$("sections").replaceChildren();state.sections.forEach((x,i)=>{btn($("sections"),(x.visible?"● ":"○ ")+x.title,()=>{tab=x.id;render()});});if(tab==="brand"){ $("editorTitle").textContent="Identidad y SEO";field(p,state,"name","Nombre comercial");imageField(p,state,"logo","Logo");field(p,state,"primary","Color principal","color");field(p,state,"accent","Color de botones","color");let sel=document.createElement("select");["system-ui","Arial","Georgia"].forEach(f=>sel.add(new Option(f,f)));sel.value=state.font;sel.onchange=()=>{state.font=sel.value;preview()};p.append("Tipografía",sel);field(p,state,"seo","Título SEO");field(p,state,"description","Descripción SEO","textarea")}else if(tab==="contact"){$("editorTitle").textContent="Contacto";field(p,state,"email","Correo","email");field(p,state,"phone","WhatsApp internacional");field(p,state,"address","Dirección");field(p,state,"instagram","URL Instagram")}else{let i=state.sections.findIndex(x=>x.id===tab),x=state.sections[i];if(!x){tab="brand";render();return}$("editorTitle").textContent="Editar sección";field(p,x,"title","Título");field(p,x,"body","Descripción","textarea");field(p,x,"visible","Visible","checkbox");if(x.type!=="catalog")imageField(p,x,"image","Imagen");if(x.type==="hero")field(p,x,"button","Texto del botón");if(x.type==="catalog"){(x.items||[]).forEach((item,j)=>{let box=document.createElement("div");box.style.borderTop="1px solid #434956";field(box,item,"name","Producto "+(j+1));field(box,item,"description","Descripción","textarea");field(box,item,"price","Precio CLP","number");field(box,item,"active","Activo","checkbox");imageField(box,item,"image","Foto");btn(box,"Eliminar producto",()=>{x.items.splice(j,1);render();preview()});p.append(box)});btn(p,"+ Producto",()=>{x.items.push({name:"Nuevo producto",description:"",price:0,image:"",active:true});render();preview()})}let row=document.createElement("div");row.className="row";btn(row,"↑",()=>{if(i>0){[state.sections[i-1],state.sections[i]]=[x,state.sections[i-1]];render();preview()}});btn(row,"↓",()=>{if(i<state.sections.length-1){[state.sections[i+1],state.sections[i]]=[x,state.sections[i+1]];render();preview()}});btn(row,"Eliminar",()=>{if(confirm("¿Eliminar esta sección?")){state.sections.splice(i,1);tab="brand";render();preview()}});p.append(row)}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$("add").onclick=()=>{let type=prompt("Tipo de sección: hero, text o catalog","text");if(!["hero","text","catalog"].includes(type))return;let x={id:crypto.randomUUID(),type,title:"Nueva sección",body:"",visible:true,image:"",items:[]};state.sections.push(x);tab=x.id;render();preview()};$("template").onchange=e=>{if(e.target.value&&confirm("¿Reemplazar el borrador con esta plantilla?")){state=initial(e.target.value);tab="brand";mode="draft";render();preview()}e.target.value=""};$("save").onclick=()=>{if(store())status("Borrador guardado")};$("publish").onclick=()=>{let old=published;published=JSON.parse(JSON.stringify(state));if(store()){mode="published";preview();status("Publicación local guardada")}else published=old};$("published").onclick=()=>{mode="published";preview()};$("draft").onclick=()=>{mode="draft";preview()};$("desktop").onclick=()=>$("frame").style.width="100%";$("mobile").onclick=()=>$("frame").style.width="min(100%,390px)";$("export").onclick=()=>{let blob=new Blob([html(state)],{type:"text/html"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="sitio-ingebam.html";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();preview();
</script></html>
