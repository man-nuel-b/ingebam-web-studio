<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA | Demo INGEBAM</title><link rel="stylesheet" href="studio.css"></head><body><header><strong id="brand"></strong><nav><a href="#catalog">Soluciones</a> · <a href="#about">Nosotros</a> · <a href="#contact">Contacto</a></nav></header><div id="promo" class="notice" hidden></div><section class="hero"><div><small>DISEÑO · CALIDAD · CONFIANZA</small><h1 id="headline"></h1><p id="intro"></p><a class="cta" href="#contact" style="background:#c4df9f;color:#18372c">Solicitar cotización</a></div><div id="hero"></div></section><section id="catalog"><small>DESCUBRE NUESTRAS SOLUCIONES</small><h2>Servicios y productos</h2><div id="items" class="cards"></div></section><section id="about"><h2>Sobre nosotros</h2><p id="aboutText"></p></section><footer id="contact"><h2>Conversemos sobre tu proyecto</h2><div id="links"></div><p>Demostración de INGEBAM Web Studio · <a href="admin.html">Panel demo</a></p></footer><script src="content.js"></script><script>function render(){const s=read().published;$('brand').replaceChildren();if(s.logo)$('brand').append(photo(s.logo));$('brand').append(document.createTextNode(s.name));for(const k of ['headline','intro'])$(k).textContent=s[k];document.title=s.name+' | Demo';$('aboutText').textContent=s.about;$('promo').hidden=!s.promotion;$('promo').textContent=s.promotion;$('hero').replaceChildren(s.hero?photo(s.hero):node('div',null,'art'));$('items').replaceChildren();s.products.filter(p=>p.active).forEach(p=>{let a=node('article'),g=node('div',null,'gallery');p.photos.forEach(src=>g.append(photo(src)));a.append(g,node('h3',p.name),node('p',p.description),node('strong',p.price>0?p.price.toLocaleString('es-CL',{style:'currency',currency:'CLP'}):'Consultar precio'),node('p',p.stock>0?'Disponible':'Sin stock'));$('items').append(a)});$('links').replaceChildren();let digits=s.phone.replace(/\D/g,'');if(digits){let a=node('a','WhatsApp');a.href='https://wa.me/'+digits;$('links').append(a,node('p',s.phone))}if(s.email){let a=node('a',s.email);a.href='mailto:'+encodeURIComponent(s.email).replace(/%40/g,'@');$('links').append(a)}if(/^https:\/\/(www\.)?instagram\.com\//i.test(s.instagram)){let a=node('a','Instagram');a.href=s.instagram;$('links').append(node('p'),a)}}render();addEventListener('storage',e=>{if(e.key===key)render()});</script></body></html>
